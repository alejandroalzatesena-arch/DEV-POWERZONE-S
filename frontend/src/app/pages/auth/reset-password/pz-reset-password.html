<section class="pz-auth-card">
  <div class="pz-auth-card__head">
    <p class="pz-eyebrow">Nueva contraseña</p>
    <h1>Crea una contraseña nueva</h1>
    <p>El enlace es de un solo uso y vence a los 30 minutos.</p>
  </div>

  @if (!token()) {
    <p class="pz-alert" role="alert">
      El enlace no incluye un token válido. Solicita uno nuevo.
    </p>
    <p class="pz-auth-card__alt">
      <a routerLink="/auth/forgot-password">Solicitar otro enlace</a>
    </p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="pz-field">
        <span>Nueva contraseña</span>
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
        @if (invalid('newPassword')) {
          <small class="pz-field__error">Mínimo 8 caracteres con letras y números.</small>
        }
      </label>

      <label class="pz-field">
        <span>Confirmar contraseña</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.hasError('passwordsMismatch') && submitted()) {
          <small class="pz-field__error">Las contraseñas no coinciden.</small>
        }
      </label>

      @if (errorMessage()) {
        <p class="pz-alert" role="alert">{{ errorMessage() }}</p>
      }

      <button pz-button type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    </form>

    <p class="pz-auth-card__alt">
      <a routerLink="/auth/login">Volver al inicio de sesión</a>
    </p>
  }
</section>
