<section class="pz-auth-card">
  <div class="pz-auth-card__head">
    <p class="pz-eyebrow">Bienvenido de nuevo</p>
    <h1>Inicia sesión</h1>
    <p class="pz-auth-card__intro">Ingresa tus datos para continuar en PowerZone.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="pz-field">
      <span>Correo electrónico</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        [attr.aria-invalid]="invalid('email')"
      />
      @if (invalid('email')) {
        <small class="pz-field__error">Ingresa un email válido.</small>
      }
    </label>

    <label class="pz-field">
      <span>Contraseña</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Mínimo 8 caracteres"
        [attr.aria-invalid]="invalid('password')"
      />
      @if (invalid('password')) {
        <small class="pz-field__error">La contraseña debe tener al menos 8 caracteres.</small>
      }
    </label>

    <div class="pz-field-row">
      <label class="pz-check">
        <input type="checkbox" formControlName="rememberMe" />
        Recordarme
      </label>
      <a routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
    </div>

    @if (errorMessage()) {
      <p class="pz-alert" role="alert">{{ errorMessage() }}</p>
    }

    <button pz-button type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>
  </form>

  <p class="pz-auth-card__alt">
    ¿Aún no tienes cuenta?
    <a routerLink="/auth/register">Regístrate</a>
  </p>
</section>
