<div class="pz-shell">
  <aside class="pz-shell__sidebar">
    <a class="pz-brand" routerLink="/app/dashboard" aria-label="PowerZone, ir al panel">
      <span class="pz-brand__tile">
        <img src="brand/powerzone-mark.webp" alt="" width="167" height="128" />
      </span>
      <span class="pz-brand__name">Power<span>Zone</span></span>
    </a>

    <nav class="pz-nav" aria-label="Navegacion principal">
      @for (item of navItems; track item.path) {
        <a
          class="pz-nav__item"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          <pz-icon [name]="item.icon" />
          <span class="pz-nav__label">
            {{ item.label }}
            <small>{{ item.hint }}</small>
          </span>
        </a>
      }
    </nav>

    <div class="pz-shell__footer">
      <p class="pz-muted">PowerZone &middot; Gestion de gimnasios</p>
    </div>
  </aside>

  <div class="pz-shell__main">
    <header class="pz-topbar">
      <div>
        <p class="pz-eyebrow">Gimnasio PowerZone Centro</p>
        <h2>Panel de control</h2>
      </div>
      <div class="pz-topbar__actions">
        <span class="pz-user">
          <span class="pz-user__avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="pz-user__meta">
            <strong>{{ displayName() || 'Sesion activa' }}</strong>
            <small>{{ roleLabel() }}</small>
          </span>
        </span>
        <button type="button" class="pz-logout" (click)="logout()">Salir</button>
      </div>
    </header>

    <main class="pz-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
