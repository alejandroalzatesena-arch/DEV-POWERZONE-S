server:
  port: ${PORT:3000}

spring:
  application:
    name: powerzone-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:powerzone}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: LOWER_CAMEL_CASE
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs-json
  swagger-ui:
    path: /api/docs
    operations-sorter: method

powerzone:
  api-version: v1
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  web-url: ${WEB_URL:http://localhost:4200}
  cookies:
    secure: ${COOKIE_SECURE:false}
  throttle:
    limit: ${THROTTLE_LIMIT:120}
    window-seconds: ${THROTTLE_WINDOW_SECONDS:60}
  jwt:
    issuer: ${JWT_ISSUER:powerzone-api}
    secret: ${JWT_SECRET:powerzone-development-secret-change-me-32-bytes}
    access-seconds: ${JWT_ACCESS_SECONDS:900}
    refresh-seconds: ${JWT_REFRESH_SECONDS:604800}
    remember-me-seconds: ${JWT_REMEMBER_SECONDS:2592000}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    key: ${AI_SERVICE_API_KEY:internal-ai-key}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  payments:
    # Firma de la pasarela simulada. En produccion se usa el secreto de Stripe.
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:powerzone-sandbox-secret}
    checkout-minutes: ${PAYMENTS_CHECKOUT_MINUTES:30}
    retry-window-hours: ${PAYMENTS_RETRY_WINDOW_HOURS:24}
    max-attempts: ${PAYMENTS_MAX_ATTEMPTS:3}
    expiring-days: ${PAYMENTS_EXPIRING_DAYS:7}
    checkout-limit: ${PAYMENTS_CHECKOUT_LIMIT:5}
    expiry-scan-ms: ${PAYMENTS_EXPIRY_SCAN_MS:60000}
